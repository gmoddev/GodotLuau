name: Runtime native qualification

on:
  push:
    paths:
      - "src/**"
      - "tests/runtime/**"
      - "tests/packaging/**"
      - "tools/generar_release.py"
      - "luau"
      - "godot-cpp"
      - ".gitmodules"
      - ".github/workflows/runtime-native-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/runtime/**"
      - "tests/packaging/**"
      - "tools/generar_release.py"
      - "luau"
      - "godot-cpp"
      - ".gitmodules"
      - ".github/workflows/runtime-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Native:
    name: Native (${{ matrix.Platform }}, Debug)
    runs-on: ${{ matrix.Runner }}
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - Platform: Windows
            Runner: windows-2022
            Generator: Visual Studio 17 2022
            Executable: Godot_v4.7.1-stable_win64.exe
            Library: Debug/godot_luau.dll
          - Platform: Linux
            Runner: ubuntu-24.04
            Generator: Ninja
            Executable: Godot_v4.7.1-stable_linux.x86_64
            Library: godot_luau.so
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record source and dependency identity
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/native-ci" build/native
          git rev-parse HEAD | tee "$RUNNER_TEMP/native-ci/revision.log"
          git submodule status --recursive | tee "$RUNNER_TEMP/native-ci/dependencies.log"
          if git submodule status --recursive | grep -E '^[-+U]'; then
            echo '[Runtime:NativeCI] Missing or mismatched pinned submodule.'
            exit 1
          fi
          python tests/runtime/SourceFingerprint.py . > "$RUNNER_TEMP/native-ci/source.json"

      - name: Require approved native policy and generated API identity
        timeout-minutes: 1
        run: python tools/GenerateNativeBindings.py --check

      - name: Verify fixture process ownership and failure handling
        timeout-minutes: 2
        run: python tests/runtime/FixtureProcessTests.py 2>&1 | tee "$RUNNER_TEMP/native-ci/process-tests.log"

      - name: Provision verified official Godot 4.7.1
        timeout-minutes: 5
        run: python tests/runtime/ProvisionGodot.py --output "$RUNNER_TEMP/godot-4.7.1" 2>&1 | tee "$RUNNER_TEMP/native-ci/provision.log"

      - name: Select existing Windows host compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/InitializeReleaseToolchain.ps1

      - name: Prepare Linux host compiler
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bash tools/PrepareLinuxCompiler.sh

      - name: Install hash-pinned host build frontend
        timeout-minutes: 3
        run: python -m pip install --require-hashes --no-deps -r tools/ReleaseBuildRequirements.txt

      - name: Build admitted GL-029 headless network host
        timeout-minutes: 120
        run: python tests/runtime/BuildSanitizedGodot.py --output "$RUNNER_TEMP/remote-host" --remote-admission --configuration Debug --jobs 2 --timeout 7000

      - name: Select verified network host executable
        shell: pwsh
        run: |
          $HostRecord = Get-Content "$env:RUNNER_TEMP/remote-host/remote-host.json" -Raw | ConvertFrom-Json
          "GODOT_RUNTIME=$($HostRecord.Executable)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Qualify native retained ownership and RPC failure propagation
        timeout-minutes: 5
        run: python tests/runtime/RunRemoteHostQualification.py --godot "$GODOT_RUNTIME" --host-manifest "$RUNNER_TEMP/remote-host/remote-host.json" --output "$RUNNER_TEMP/native-ci/hostqualification"

      - name: Verify DataStore companion archive packaging
        timeout-minutes: 2
        run: python tests/packaging/PackagingTests.py 2>&1 | tee "$RUNNER_TEMP/native-ci/package-tests.log"

      - name: Configure production native adapter
        timeout-minutes: 5
        run: |
          cmake -S tests/runtime -B build/native -G "${{ matrix.Generator }}" \
            -DCMAKE_BUILD_TYPE=Debug -DGL_BUILD_CORE_TESTS=OFF \
            -DGL_BUILD_GODOT_ADAPTER=ON \
            2>&1 | tee build/native/configure.log

      - name: Build GodotLuauAdapter
        timeout-minutes: 50
        run: |
          cmake --build build/native --config Debug --target GodotLuauAdapter DatastoreBackendProbe --parallel 2 \
            2>&1 | tee build/native/build.log

      - name: Expose installed MSVC Debug runtime
        if: ${{ runner.os == 'Windows' }}
        timeout-minutes: 1
        shell: pwsh
        run: |
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $Installation = & $VsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $Installation) { throw '[Runtime:NativeCI] MSVC installation unavailable.' }
          $Runtime = Get-ChildItem -Path "$Installation\VC\Redist\MSVC\*\debug_nonredist\x64\Microsoft.VC*.DebugCRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $Runtime -or -not (Test-Path -LiteralPath (Join-Path $Runtime.FullName 'vcruntime140d.dll'))) { throw '[Runtime:NativeCI] Installed MSVC Debug CRT unavailable.' }
          $Runtime.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "[Runtime:NativeCI] Debug CRT: $($Runtime.FullName)" | Tee-Object -FilePath "$env:RUNNER_TEMP/native-ci/msvc-runtime.log"

      - name: Single-player listen dedicated and editor lifecycle
        timeout-minutes: 4
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/regression" --teardown --coordinated-close --timeout 60

      - name: Actual Godot ScriptEditor native bindings and diagnostics
        timeout-minutes: 2
        run: |
          python tests/editor/RunNativeAuthoring.py \
            --godot "$RUNNER_TEMP/godot-4.7.1/${{ matrix.Executable }}" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/native-editor" --timeout 60

      - name: Actual native Luau clean-project authoring and preview workflow
        timeout-minutes: 2
        run: |
          python tests/editor/RunNativeAuthoring.py \
            --godot "$RUNNER_TEMP/godot-4.7.1/${{ matrix.Executable }}" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/luau-workflow" --workflow --timeout 70

      - name: GL-006 and GL-008 existing network regressions
        timeout-minutes: 4
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/security" --security --timeout 60

      - name: GL-029 unified RemoteEvent ENet admission and lifecycle
        timeout-minutes: 4
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/remote" --remote --timeout 90

      - name: GL-020 existing functional animation lifecycle
        timeout-minutes: 5
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/animation" --animation --timeout 60

      - name: Character V2 Model lifecycle and GL-007 authority regressions
        timeout-minutes: 5
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/characters" --characters --timeout 60

      - name: GL-004 isolated resource and recovery cases
        timeout-minutes: 3
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/resources" --resources --timeout 15

      - name: GL-003 confined filesystem and cross-process services
        timeout-minutes: 3
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/filesystem" --filesystem --timeout 60

      - name: GL-005 asynchronous HTTP authority bounds and lifecycle
        timeout-minutes: 3
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/http" --http --timeout 60

      - name: GL-023 public HttpService JSON headers UUID and options
        timeout-minutes: 3
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/httpservice" --httpservice --timeout 60

      - name: GL-023 published HTTP and JSON caller migration
        timeout-minutes: 2
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/callers" --callers --timeout 30

      - name: Character V2 presentation assertions (headless, not graphical qualification)
        timeout-minutes: 4
        run: |
          python tests/runtime/RunCharacterPresentation.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --asset-godot "$RUNNER_TEMP/godot-4.7.1/${{ matrix.Executable }}" \
            --output "$RUNNER_TEMP/native-ci/presentation"

      - name: Character performance fixture execution (not a speed gate)
        timeout-minutes: 3
        run: |
          python tests/runtime/RunCharacterPerformance.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --asset-godot "$RUNNER_TEMP/godot-4.7.1/${{ matrix.Executable }}" \
            --output "$RUNNER_TEMP/native-ci/performance" --trials 1 --samples 120 --counts 1,16

      - name: GL-009 transactional persistence and interrupted commit recovery
        timeout-minutes: 4
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/datastore" --datastore --timeout 60

      - name: Input actions and real GUI routing
        timeout-minutes: 2
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/input" --input --timeout 45

      - name: Actual Player.Character scripted control and ENet lifecycle
        timeout-minutes: 4
        run: |
          python tests/runtime/RunQualification.py \
            --godot "$GODOT_RUNTIME" \
            --extension "build/native/${{ matrix.Library }}" \
            --output "$RUNNER_TEMP/native-ci/controller" --player-controller --timeout 60

      - name: Require all native actors and retain identity
        timeout-minutes: 1
        run: |
          python tests/runtime/CheckNativeCI.py --output "$RUNNER_TEMP/native-ci" \
            --extension "build/native/${{ matrix.Library }}" \
            --godot-evidence "$RUNNER_TEMP/godot-4.7.1/provenance.json" \
            --remote-host-evidence "$RUNNER_TEMP/remote-host/remote-host.json" \
            --remote-host-qualification "$RUNNER_TEMP/native-ci/hostqualification" --revision "$GITHUB_SHA"

      - name: Retain native qualification diagnostics
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: runtime-native-${{ matrix.Platform }}-Debug
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-ci/**/*.log
            ${{ runner.temp }}/native-ci/**/results.json
            ${{ runner.temp }}/native-ci/**/server-results.json
            ${{ runner.temp }}/native-ci/**/native-evidence.json
            ${{ runner.temp }}/native-ci/**/function-evidence.json
            ${{ runner.temp }}/native-ci/**/replication-evidence.json
            ${{ runner.temp }}/native-ci/**/relevance-evidence.json
            ${{ runner.temp }}/native-ci/**/controller-evidence.json
            ${{ runner.temp }}/native-ci/**/player-controller-*.json
            ${{ runner.temp }}/native-ci/**/measurements.json
            ${{ runner.temp }}/native-ci/**/inputs.json
            ${{ runner.temp }}/native-ci/**/guids.txt
            ${{ runner.temp }}/native-ci/**/latency-proxy.json
            ${{ runner.temp }}/native-ci/source.json
            ${{ runner.temp }}/native-ci/summary.json
            ${{ runner.temp }}/godot-4.7.1/provenance.json
            ${{ runner.temp }}/remote-host/remote-host.json
            ${{ runner.temp }}/remote-host-attempts/**
            ${{ runner.temp }}/native-ci/hostqualification/**/*.json
            build/native/*.log
            build/native/CMakeFiles/CMakeConfigureLog.yaml
