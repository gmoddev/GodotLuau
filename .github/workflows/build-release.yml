name: Build & release (Windows + Linux)

# Dormant publication path. Source builds, qualification and packages belong to
# the separate read-only release-candidate workflow. Neither job is enabled.

on:
  workflow_dispatch:

permissions:
  contents: read

# Fork interim policy: no builds, archive commits, or publication, even on manual
# dispatch. Enabling production distribution requires a separately reviewed change.

# Serialize this workflow's publishing runs; never cancel an active publication.
concurrency:
  group: godotluau-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    if: ${{ false }}
    uses: ./.github/workflows/release-candidate.yml

  release:
    if: ${{ false }}
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download qualified source-built candidate artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: candidates

      - name: Leer version
        id: ver
        run: |
          VER=$(head -n1 Version | tr -d '\r' | sed 's/^[ \t]*//; s/[ \t]*$//')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=GodotLuau-$(echo "$VER" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

      # Published releases, assets and tags are retained. A repeated version is
      # rejected before packaging/committing/publishing, not replaced in place.
      - name: Require a new release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: python3 tools/CheckReleaseIdentity.py

      - name: Select qualified platform packages
        run: |
          cp candidates/candidate-Windows/GodotLuau-Windows.zip "Windows GodotLuau ${{ steps.ver.outputs.ver }}.zip"
          cp candidates/candidate-Linux/GodotLuau-Linux.zip "Linux GodotLuau ${{ steps.ver.outputs.ver }}.zip"

      - name: Publicar Release unificado
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "GodotLuau ${{ steps.ver.outputs.ver }}"
          make_latest: true
          prerelease: false
          overwrite_files: false
          body: |
            Extensión GodotLuau para Godot 4 (Windows + Linux).
            Instala/actualiza sola con el plugin **GodotLuauUpdater**.
            Descarga manual por plataforma abajo:
          files: |
            Windows GodotLuau ${{ steps.ver.outputs.ver }}.zip
            Linux GodotLuau ${{ steps.ver.outputs.ver }}.zip

      # Retention is nondestructive: no automatic deletion or historical rewrite.
