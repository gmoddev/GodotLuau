name: Build & release (Windows + Linux + Android)

# Compila Linux y Android (arm64) en la nube, toma las DLL de Windows del
# GodotLuau.zip ya commiteado, arma el zip UNIFICADO (todos los binarios, para
# el auto-updater) + un zip por editor (Windows / Linux, los dos con las
# librerias de Android para exportar), commitea el zip y crea el Release
# "GodotLuau <version>" con los assets etiquetados por plataforma.
#
# En un pull request solo se compila (Linux y Android) para comprobar que el
# codigo compila: no se empaqueta, no se commitea nada y no se publica Release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "addons/**"
      - "SConstruct"
      - "Version"
      - "godot_luau.gdextension"
      - "tools/generar_release.py"
      - ".github/workflows/build-release.yml"
  pull_request:
    paths:
      - "src/**"
      - "SConstruct"
      - "godot_luau.gdextension"
      - "tools/generar_release.py"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  linux:
    # 22.04: glibc 2.35 — los binarios corren tambien en distros mas viejas
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SCons
        run: pip install scons
      - name: Build template_debug
        run: scons platform=linux target=template_debug -j4
      - name: Build template_release
        run: scons platform=linux target=template_release -j4
      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: GodotLuau/bin/*.so

  android:
    # El exportador de Android de Godot 4 carga libgodot_luau.android.*.arm64.so
    # (ver godot_luau.gdextension). Mismo NDK que usa godot-cpp por defecto.
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: "23.2.8568313"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SCons
        run: pip install scons
      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
      - name: Build template_debug (arm64)
        run: scons platform=android arch=arm64 target=template_debug ndk_version=$NDK_VERSION -j4
      - name: Build template_release (arm64)
        run: scons platform=android arch=arm64 target=template_release ndk_version=$NDK_VERSION -j4
      - name: Upload Android binaries
        uses: actions/upload-artifact@v4
        with:
          name: android-bin
          path: GodotLuau/bin/*.so

  release:
    needs: [linux, android]
    # En los pull requests solo se compila; empaquetar y publicar solo desde main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Las DLL de Windows viven dentro del GodotLuau.zip que subo yo. Se sacan
      # de ahi (asi la CI no tiene que compilar Windows).
      - name: Extraer binarios de Windows del zip actual
        run: |
          mkdir -p GodotLuau/bin
          unzip -o GodotLuau.zip 'GodotLuau/bin/*' -d . || echo "zip sin bin (primera vez)"

      - name: Traer binarios de Linux (recien compilados)
        uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: GodotLuau/bin

      - name: Traer binarios de Android (recien compilados)
        uses: actions/download-artifact@v4
        with:
          name: android-bin
          path: GodotLuau/bin

      - name: Leer version
        id: ver
        run: |
          VER=$(head -n1 Version | tr -d '\r' | sed 's/^[ \t]*//; s/[ \t]*$//')
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=GodotLuau-$(echo "$VER" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"

      - name: Empaquetar zips (unificado + por plataforma)
        run: |
          python3 tools/generar_release.py
          python3 tools/generar_release.py --only windows --out "Windows GodotLuau ${{ steps.ver.outputs.ver }}.zip"
          python3 tools/generar_release.py --only linux   --out "Linux GodotLuau ${{ steps.ver.outputs.ver }}.zip"

      - name: Commit GodotLuau.zip (auto-updater, Windows + Linux + Android)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GodotLuau.zip GodotLuau.zip.sha256
          git commit -m "CI: GodotLuau.zip con binarios Windows+Linux+Android (${{ steps.ver.outputs.ver }}) [skip ci]" || echo "sin cambios en el zip"
          git push

      - name: Publicar Release unificado
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "GodotLuau ${{ steps.ver.outputs.ver }}"
          make_latest: true
          prerelease: false
          body: |
            Extensión GodotLuau para Godot 4 (Windows + Linux, y exportación a Android arm64).
            Instala/actualiza sola con el plugin **GodotLuauUpdater**.
            Descarga manual por plataforma abajo:
          files: |
            Windows GodotLuau ${{ steps.ver.outputs.ver }}.zip
            Linux GodotLuau ${{ steps.ver.outputs.ver }}.zip

      # Solo debe quedar el Release de la version mas nueva: se borran los demas
      # (y su tag). Se hace DESPUES de publicar, asi que si el publicado fallara
      # no nos quedariamos sin ninguno.
      - name: Borrar Releases antiguos (dejar solo el actual)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ steps.ver.outputs.tag }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            if [ "$tag" != "$KEEP" ]; then
              echo "borrando release y tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || echo "  (no se pudo borrar $tag)"
            fi
          done
